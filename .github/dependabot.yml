# Dependency and Actions update monitoring.
# https://docs.github.com/code-security/dependabot
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Fold routine minor/patch bumps into one PR to cut review noise; majors
    # and security updates still arrive as their own PRs.
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # TypeScript 7's native rewrite drops the compiler API `next build` needs,
    # and typescript-eslint supports <6.1. package.json pins 5.x via
    # `overrides`; stop proposing majors until Next.js supports them.
    ignore:
      - dependency-name: "typescript"
        versions: [">=6.0.0"]
      # eslint-plugin-react/jsx-a11y/import (via eslint-config-next) support
      # ESLint <=9; on 10 lint crashes. Lift once they declare support.
      - dependency-name: "eslint"
        versions: [">=10.0.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
