name: IndexNow

# Vercel reports each deployment back to GitHub. When a production deploy
# succeeds, tell IndexNow search engines (Bing and others) which pages changed.
# Run it by hand with "all" to resubmit every page in the sitemap.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      all:
        description: "Submit every URL in the sitemap, not just recent changes"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  submit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Submit changed pages
        run: node scripts/indexnow.mjs ${{ inputs.all && '--all' || '' }}
